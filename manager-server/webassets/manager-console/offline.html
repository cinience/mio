<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线模式</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0b1220 0%, #1668dc 100%);
        color: #ffffff;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 16px;
        padding: 32px 28px;
        max-width: 360px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin-bottom: 16px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        font-size: 16px;
      }
      .tips {
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>您当前处于离线状态</h1>
      <p>请检查网络连接，恢复在线后刷新页面即可继续使用管理控制台。</p>
      <p class="tips">提示：已缓存的内容仍然可访问，网络恢复会自动同步最新数据。</p>
    </div>
  </body>
</html>
