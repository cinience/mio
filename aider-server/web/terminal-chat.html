<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aider-server 终端对话</title>
  <style>
    :root {
      --bg: #f7f1e8;
      --panel: #ffffff;
      --ink: #1b1b1b;
      --muted: #6b6b6b;
      --accent: #e86a33;
      --accent-soft: #fde3d6;
      --assistant: #1b1b1b;
      --assistant-bg: #f3f0eb;
      --user-bg: #e86a33;
      --user-ink: #fff;
      --shadow: 0 20px 50px rgba(27, 27, 27, 0.12);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(232, 106, 51, 0.18), transparent 55%),
        linear-gradient(140deg, #f9f2e7 0%, #f7f1e8 40%, #f3e9dc 100%);
      color: var(--ink);
      padding: 24px;
    }

    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 32px);
    }

    section {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid #e0d7ce;
      background: #faf7f2;
      font-size: 14px;
    }

    textarea {
      min-height: 64px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
    }

    button.secondary {
      background: #f1ece6;
      color: var(--ink);
      border: 1px solid #e3d8cd;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px 18px 6px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      color: var(--assistant);
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-ink);
    }

    .bubble.system {
      align-self: center;
      background: #f7e8dd;
      color: var(--muted);
      font-size: 12px;
    }

    .chat-input {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }
      .bubble {
        max-width: 100%;
      }
      .chat-input {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>任务终端对话</h1>
        <div id="task-title" class="status"></div>
      </div>
      <a href="/">返回列表</a>
    </header>

    <section>
      <div class="row">
        <div>
          <label for="task-id">任务 ID</label>
          <input id="task-id" placeholder="task id" />
        </div>
        <div>
          <label for="token">Token（可选）</label>
          <input id="token" placeholder="Bearer token" />
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="connect">连接对话</button>
        <button class="secondary" id="disconnect">断开连接</button>
        <button class="secondary" id="interrupt">中断任务</button>
      </div>
      <div class="hint">提示：对话视图会显示终端输出，发送内容等同于在终端输入并回车。</div>
    </section>

    <section class="chat-panel">
      <div class="chat-stream" id="chat-stream"></div>
      <div class="chat-input">
        <textarea id="chat-input" placeholder="输入指令或内容，回车发送（Shift+Enter 换行）"></textarea>
        <button class="primary" id="send">发送</button>
      </div>
      <div class="status" id="connection-status">未连接</div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const taskIdInput = document.getElementById("task-id");
    const tokenInput = document.getElementById("token");
    const taskTitle = document.getElementById("task-title");
    const chatStream = document.getElementById("chat-stream");
    const chatInput = document.getElementById("chat-input");
    const statusLine = document.getElementById("connection-status");

    taskIdInput.value = params.get("taskId") || "";
    tokenInput.value = params.get("token") || localStorage.getItem("aider-token") || "";
    if (params.get("token")) {
      localStorage.setItem("aider-token", tokenInput.value.trim());
    }
    if (taskIdInput.value) {
      taskTitle.textContent = `任务: ${taskIdInput.value}`;
    }

    let ws = null;
    let closeByUser = false;
    let cursor = 0;
    let pendingLine = "";
    let taskProtocol = "pty";
    const textDecoder = new TextDecoder("utf-8");
    const textEncoder = new TextEncoder();

    function appendBubble(text, role = "assistant") {
      if (!text) return;
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      chatStream.appendChild(bubble);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function setStatus(text) {
      statusLine.textContent = text;
    }

    function authHeaders() {
      const token = localStorage.getItem("aider-token") || "";
      if (!token) return {};
      return { Authorization: `Bearer ${token}` };
    }

    function stripAnsi(input) {
      return input.replace(
        /\u001b\[[0-9;?]*[ -/]*[@-~]|\u001b\][^\u0007]*(?:\u0007|\u001b\\)/g,
        ""
      );
    }

    function handleOutputChunk(text, rawBytes) {
      cursor += rawBytes;
      localStorage.setItem(`terminal-cursor-${taskIdInput.value.trim()}`, String(cursor));
      const cleaned = stripAnsi(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const parts = cleaned.split("\n");
      if (parts.length === 1) {
        pendingLine += parts[0];
        return;
      }
      parts.forEach((part, idx) => {
        if (idx === 0) {
          const line = pendingLine + part;
          pendingLine = "";
          if (line.trim()) appendBubble(line, "assistant");
          return;
        }
        if (idx === parts.length - 1) {
          pendingLine = part;
          return;
        }
        if (part.trim()) appendBubble(part, "assistant");
      });
    }

    async function loadTaskProtocol(taskId) {
      try {
        const res = await fetch(`/api/v1/tasks/${taskId}`, { headers: authHeaders() });
        const data = await res.json();
        if (res.ok && data && data.protocol) {
          taskProtocol = data.protocol;
        } else {
          taskProtocol = "pty";
        }
      } catch (err) {
        taskProtocol = "pty";
      }
    }

    async function connect() {
      const taskId = taskIdInput.value.trim();
      if (!taskId) {
        appendBubble("请输入任务 ID 后连接。", "system");
        return;
      }
      const token = tokenInput.value.trim();
      if (token) {
        localStorage.setItem("aider-token", token);
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      closeByUser = false;
      cursor = Number(localStorage.getItem(`terminal-cursor-${taskId}`) || 0);
      await loadTaskProtocol(taskId);
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const url = new URL(`${protocol}://${location.host}/api/v1/tasks/${taskId}/terminal`);
      if (token) url.searchParams.set("token", token);
      if (cursor > 0) url.searchParams.set("cursor", String(cursor));
      ws = new WebSocket(url.toString());
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        appendBubble("已连接终端对话。", "system");
        if (taskProtocol === "app-server") {
          appendBubble("当前为 App Server 模式，输入会通过对话接口发送。", "system");
        }
        setStatus("已连接");
        if (chatInput) chatInput.focus();
      };
      ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          const bytes = new Uint8Array(event.data);
          handleOutputChunk(textDecoder.decode(bytes, { stream: true }), bytes.length);
        } else if (typeof event.data === "string") {
          handleOutputChunk(event.data, textEncoder.encode(event.data).length);
        }
      };
      ws.onerror = () => {
        appendBubble("终端连接失败。", "system");
        setStatus("连接错误");
      };
      ws.onclose = () => {
        setStatus("已断开");
        if (!closeByUser) {
          appendBubble("终端连接已断开。", "system");
        }
        closeByUser = false;
      };
    }

    function disconnect() {
      if (ws) {
        closeByUser = true;
        ws.close();
        ws = null;
      }
    }

    function sendMessage() {
      const text = chatInput.value;
      if (!text.trim()) return;
      appendBubble(text, "user");
      if (taskProtocol === "app-server") {
        sendChatMessage(text).catch(() => {
          appendBubble("消息发送失败。", "system");
        });
      } else if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(textEncoder.encode(text + "\\n"));
      } else {
        appendBubble("未连接终端，消息未发送。", "system");
      }
      chatInput.value = "";
      chatInput.focus();
    }

    async function sendChatMessage(text) {
      const taskId = taskIdInput.value.trim();
      if (!taskId) return;
      const res = await fetch(`/api/v1/tasks/${taskId}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || "发送失败");
      }
    }

    async function interrupt() {
      const taskId = taskIdInput.value.trim();
      if (!taskId) {
        appendBubble("请输入任务 ID 后中断。", "system");
        return;
      }
      try {
        const res = await fetch(`/api/v1/tasks/${taskId}/interrupt`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "中断失败");
        appendBubble(`已中断任务：${data.id}`, "system");
      } catch (err) {
        const message = err instanceof Error ? err.message : String(err || "中断失败");
        appendBubble(`中断失败：${message}`, "system");
      }
    }

    document.getElementById("connect").addEventListener("click", connect);
    document.getElementById("disconnect").addEventListener("click", disconnect);
    document.getElementById("interrupt").addEventListener("click", interrupt);
    document.getElementById("send").addEventListener("click", sendMessage);

    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    if (taskIdInput.value) {
      connect();
    }
  </script>
</body>
</html>
